name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

# One place for the toolchain. Wayfare learned this the expensive way: the Go
# version lived in three separate job definitions, drifted, and lint ended up
# passing on a different toolchain than the one that built the binary. Defining
# it once keeps CI honest about go.mod, which says 1.22.2.
env:
  GO_VERSION: "1.22"

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build ./...

  # The float ban is the project's central invariant and the one most likely to
  # be violated by an otherwise reasonable change, because float64 is what a Go
  # programmer reaches for without thinking. Convention would not hold it; this
  # does. The statistical layer, when it exists, will live in Python and is
  # explicitly exempt — this checks the Go accounting path only.
  no-floats:
    name: no floats in the accounting path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: grep for float types in pkg/ and cmd/
        run: |
          set -euo pipefail
          if ! ls pkg cmd >/dev/null 2>&1; then
            echo "no pkg/ or cmd/ yet; nothing to check"
            exit 0
          fi
          # Strip comment lines first. The grep was matching the package
          # documentation that explains *why* floats are banned, which is a
          # spectacular way to make a guard rail useless: it fires on the
          # sentence describing the rule and cries wolf until someone disables
          # it. Only lines of actual code are checked.
          hits=$(grep -rnE '\bfloat(32|64)\b|ParseFloat|\bmath\.' pkg cmd \
                   --include='*.go' \
                 | grep -vE ':[0-9]+:[[:space:]]*(//|\*)' || true)
          if [ -n "$hits" ]; then
            echo "Floating-point arithmetic found in the accounting path:"
            echo "$hits"
            echo
            echo "Every monetary value in Gauge is decimal.Decimal. See CONTRIBUTING.md."
            exit 1
          fi
          echo "clean: no float types in pkg/ or cmd/"

  # The suite must run from recorded fixtures, never from live Horizon, or it
  # passes and fails on SDF's uptime rather than on the code.
  #
  # This job earned its place immediately. On its first run it caught the
  # client following Horizon's absolute `next` pagination links straight back
  # to mainnet — page one from the local test server, page two from the real
  # internet. Every test passed on a connected machine. See Client.rebase.
  offline-tests:
    name: tests run with no network
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: download modules
        run: go mod download

      - name: run tests with no network
        run: |
          set -euo pipefail

          # Ubuntu runners restrict unprivileged user namespaces through
          # AppArmor, so plain `unshare -rn` fails on uid_map. Lifting that is
          # preferable to sudo: as root the module cache resolves to a
          # different HOME and the download just warmed is missed.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          # Loopback stays up inside the namespace because the tests stand up
          # httptest servers on 127.0.0.1; tearing it down would fail them for
          # a reason unrelated to egress.
          unshare -rn bash -c 'ip link set lo up 2>/dev/null; go test -count=1 ./...'

  # The metrics layer. Added in the commit that first created Python, not
  # before, so the job never sat green over an empty directory.
  python:
    name: metrics layer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pkg/metrics
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: format
        run: ruff format --check .

      - name: pytest
        run: pytest -q

  # The accounting path is decimal end to end; the statistical layer is not.
  # This job draws that line where the code cannot: every module except
  # series.py must be free of float, math and any numeric third-party import.
  #
  # Python cannot be guarded by a blanket grep the way Go is, because floats are
  # legitimate in one module. Naming the exemption in CI is what keeps it a
  # single documented exception rather than a habit.
  python-float-boundary:
    name: floats confined to the statistical layer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: check the accounting modules
        run: |
          set -euo pipefail
          cd pkg/metrics/gauge_metrics
          # series.py is the declared statistical layer and is exempt.
          # cli.py formats a float it is handed, and does not compute one.
          offenders=$(grep -nE '\bfloat\(|\bimport math\b|\bnumpy\b|\bpolars\b' \
                        *.py \
                      | grep -v '^series\.py:' \
                      | grep -v '^cli\.py:.*isinstance' \
                      | grep -vE ':[0-9]+:[[:space:]]*#' || true)
          if [ -n "$offenders" ]; then
            echo "Floating-point arithmetic outside the statistical layer:"
            echo "$offenders"
            echo
            echo "Only gauge_metrics/series.py may convert to float. See CONTRIBUTING.md."
            exit 1
          fi
          echo "clean: floats confined to series.py"
